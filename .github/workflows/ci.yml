name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` builds the native modules the backend needs
      # (better-sqlite3, argon2) — hence no --ignore-scripts here.
      - run: npm ci

      # The same command a developer runs locally. If this passes on a
      # machine and fails here, the difference is the machine, not the gate.
      - run: npm run verify

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Separate job because it needs browsers and starts two servers: keeping
    # it out of `verify` means a plain type error reports in a minute rather
    # than after a full browser matrix.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium and Firefox only. The WebKit project in
      # playwright.config.ts is deliberately not run here: it has never been
      # verified green (WebKit cannot navigate at all on the development
      # machine this suite was stabilised on), and a job that fails for
      # reasons nobody can reproduce locally trains people to ignore CI.
      - run: npx playwright install --with-deps chromium firefox

      - run: npm run test:e2e -- --project=chromium --project=firefox
        env:
          CI: true

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
