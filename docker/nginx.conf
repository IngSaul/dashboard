# Serves the built SPA and proxies /api/* to the backend service — the
# same-origin reverse-proxy topology from
# specs/003-auth-persistence/research.md §6: the browser only ever sees one
# origin, so the session cookie stays first-party and SameSite=Lax works
# without forcing HTTPS on a LAN deployment.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS. Resolving `backend` through a variable (rather
        # than a literal upstream) stops nginx from failing hard at startup
        # with "host not found in upstream" and lets it re-resolve if the
        # backend container is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host "backend";

        # A variable in proxy_pass disables nginx's automatic URI rewrite, so
        # strip the /api/ prefix explicitly to keep the previous behaviour
        # (/api/foo -> backend:3210/foo).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_host:3210;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
